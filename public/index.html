<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedel — Агрегатор новостей</title>
    
    <!-- Material Icons & Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Serif:opsz@8..144&display=swap" rel="stylesheet">


	<style>
    
    /* Material Design 3 Theme — GNOME Feeds Style */
    :root {
        --md-sys-color-primary: #3584E4;
        --md-sys-color-on-primary: #FFFFFF;
        --md-sys-color-primary-container: #1E5FB4;
        --md-sys-color-on-primary-container: #FFFFFF;
        --md-sys-color-surface: #FAFAFA;
        --md-sys-color-surface-variant: #F0F0F0;
        --md-sys-color-on-surface: #1A1A1A;
        --md-sys-color-on-surface-variant: #5E5E5E;
        --md-sys-color-outline: #DEDEDE;
        --md-sys-color-background: #FFFFFF;
        --md-sys-color-error: #E01B24;
        
        --md-elevation-1: 0px 1px 3px 0px rgba(0,0,0,0.08);
        --md-elevation-2: 0px 4px 8px 0px rgba(0,0,0,0.06);
        --md-elevation-3: 0px 8px 16px 0px rgba(0,0,0,0.08);
        
        --transition-standard: all 0.2s ease;
        --border-radius-standard: 12px;
        
        --col-left-width: 260px;
        --col-middle-width: 340px;
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--md-sys-color-background);
        color: var(--md-sys-color-on-surface);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    
    /* Top App Bar — Минималистичная */
    .top-bar {
        display: flex;
        align-items: center;
        padding: 8px 20px;
        background: var(--md-sys-color-surface);
        gap: 12px;
        flex-shrink: 0;
    }
    
    .top-bar h1 {
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        color: var(--md-sys-color-on-surface);
        flex: 1;
    }
    
    .search-wrapper {
        display: flex;
        align-items: center;
        background: var(--md-sys-color-surface-variant);
        border-radius: 32px;
        padding: 4px 8px 4px 16px;
        min-width: 280px;
        transition: var(--transition-standard);
    }
    
    .search-wrapper:focus-within {
        background: var(--md-sys-color-surface);
        box-shadow: var(--md-elevation-1);
        outline: 2px solid var(--md-sys-color-primary);
    }
    
    .search-wrapper .material-symbols-outlined {
        color: var(--md-sys-color-on-surface-variant);
        font-size: 20px;
    }
    
    .search-wrapper input {
        background: transparent;
        border: none;
        padding: 8px 12px;
        color: var(--md-sys-color-on-surface);
        font-size: 0.95rem;
        outline: none;
        width: 100%;
    }
    
    .search-wrapper input::placeholder {
        color: var(--md-sys-color-on-surface-variant);
        font-weight: 400;
    }
    
    .icon-btn {
        background: transparent;
        border: none;
        color: var(--md-sys-color-on-surface-variant);
        width: 40px;
        height: 40px;
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition-standard);
    }
    
    .icon-btn:hover {
        background: var(--md-sys-color-surface-variant);
        color: var(--md-sys-color-on-surface);
    }
    
    /* Main Layout */
    .app-container {
        display: flex;
        flex: 1;
        overflow: hidden;
        gap: 0;
        background: var(--md-sys-color-outline);
    }
    
    /* Left Column */
    .sources-column {
        width: var(--col-left-width);
        min-width: 200px;
        max-width: 400px;
        background: var(--md-sys-color-surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: none;
        border-right: 1px solid var(--md-sys-color-outline);
    }
    
    .column-header {
        padding: 16px 20px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    
    .column-header h2 {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: var(--md-sys-color-on-surface-variant);
    }
    
    .column-header .icon-btn {
        width: 32px;
        height: 32px;
    }
    
    .sources-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px 8px;
    }
    
    .source-item {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        margin: 2px 0;
        border-radius: var(--border-radius-standard);
        cursor: pointer;
        transition: var(--transition-standard);
        color: var(--md-sys-color-on-surface);
        gap: 12px;
    }
    
    .source-item:hover {
        background: var(--md-sys-color-surface-variant);
    }
    
    .source-item.active {
        background: color-mix(in srgb, var(--md-sys-color-primary) 12%, transparent);
        color: var(--md-sys-color-on-surface);
        font-weight: 500;
    }
    
    .source-item .material-symbols-outlined {
        font-size: 20px;
        color: var(--md-sys-color-on-surface-variant);
    }
    
    .source-item.active .material-symbols-outlined {
        color: var(--md-sys-color-primary);
    }
    
    .source-info {
        flex: 1;
    }
    
    .source-name {
        font-weight: 500;
        font-size: 0.95rem;
    }
    
    .source-count {
        font-size: 0.75rem;
        color: var(--md-sys-color-on-surface-variant);
    }
    
    .delete-source-btn {
        opacity: 0;
        transition: var(--transition-standard);
        width: 28px;
        height: 28px;
    }
    
    .source-item:hover .delete-source-btn {
        opacity: 1;
    }
    
    .delete-source-btn:hover {
        background: rgba(224, 27, 36, 0.1) !important;
        color: var(--md-sys-color-error) !important;
    }
    
    /* Middle Column */
    .articles-column {
        width: var(--col-middle-width);
        min-width: 260px;
        max-width: 480px;
        background: var(--md-sys-color-surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--md-sys-color-outline);
    }
    
    .articles-column .column-header {
        padding: 16px 20px 8px;
    }
    
    .articles-column .badge {
        background: var(--md-sys-color-surface-variant);
        color: var(--md-sys-color-on-surface-variant);
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    
    .articles-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0 8px;
    }
    
    .article-item {
        padding: 14px 20px;
        cursor: pointer;
        transition: var(--transition-standard);
        border-radius: 0;
    }
    
    .article-item:hover {
        background: var(--md-sys-color-surface-variant);
    }
    
    .article-item.active {
        background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
        border-left: 1px solid var(--md-sys-color-primary);
    }
    
    .article-source {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-bottom: 6px;
        color: var(--md-sys-color-primary);
    }
    
    .article-title {
        font-weight: 500;
        font-size: 0.95rem;
        line-height: 1.4;
        margin-bottom: 8px;
        color: var(--md-sys-color-on-surface);
    }
    
    .article-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--md-sys-color-on-surface-variant);
    }
    
    .article-time {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    
    .article-time .material-symbols-outlined {
        font-size: 14px;
    }
    
    /* Right Column */
    .content-column {
        flex: 1;
        background: var(--md-sys-color-surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    .content-header {
        padding: 28px 40px 16px;
        border-bottom: 1px solid var(--md-sys-color-outline);
    }
    
    .content-source {
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--md-sys-color-primary);
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
    }
    
    .content-title {
        font-weight: 600;
        font-size: 2rem;
        line-height: 1.2;
        margin-bottom: 16px;
        letter-spacing: -0.02em;
    }
    
    .content-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--md-sys-color-on-surface-variant);
        font-size: 0.85rem;
    }
    
    .content-meta {
        display: flex;
        gap: 16px;
        align-items: center;
    }
    
    .content-actions-inline {
        display: flex;
        gap: 8px;
    }
    
    .content-body {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 32px 40px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--md-sys-color-on-surface);
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
    
    .content-body * {
        max-width: 100% !important;
        box-sizing: border-box;
    }
    
    .content-body img,
    .content-body video,
    .content-body iframe,
    .content-body embed,
    .content-body object {
        max-width: 100% !important;
        height: auto !important;
        display: block;
        margin: 16px 0;
        border-radius: 8px;
    }
    
    .content-body pre,
    .content-body table {
        max-width: 100% !important;
        overflow-x: auto !important;
        display: block;
    }
    
    .content-body pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        background: var(--md-sys-color-surface-variant);
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
    }
    
    .content-body a {
        word-break: break-all;
        color: var(--md-sys-color-primary);
        text-decoration: none;
    }
    
    .content-body table {
        border-collapse: collapse;
        margin: 16px 0;
    }
    
    .content-body td,
    .content-body th {
        padding: 8px 12px;
        border: 1px solid var(--md-sys-color-outline);
    }
    
    /* Кнопки */
    .md-button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        border-radius: 40px;
        font-weight: 500;
        font-size: 0.85rem;
        cursor: pointer;
        transition: var(--transition-standard);
        border: none;
        background: transparent;
        color: var(--md-sys-color-on-surface);
    }
    
    .md-button.filled {
        background: var(--md-sys-color-primary);
        color: white;
    }
    
    .md-button.filled:hover {
        opacity: 0.88;
    }
    
    .md-button.outlined {
        border: 1px solid var(--md-sys-color-outline);
    }
    
    .md-button:hover {
        background: var(--md-sys-color-surface-variant);
    }
    
    .md-button.compact {
        padding: 6px 14px;
        font-size: 0.8rem;
    }
    
    /* Resize handles */
    .resize-handle {
        width: 1px;
        background: transparent;
        cursor: col-resize;
        position: relative;
        z-index: 10;
        transition: var(--transition-standard);
        flex-shrink: 0;
    }
    
    .resize-handle:hover,
    .resize-handle.active {
        background: var(--md-sys-color-primary);
        opacity: 0.4;
    }
    
    .resize-handle::before {
        content: '';
        position: absolute;
        left: -4px;
        right: -4px;
        top: 0;
        bottom: 0;
        background: transparent;
    }
    
    body.resizing {
        cursor: col-resize !important;
        user-select: none !important;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar {
        width: 6px;
    }
    
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
        background: var(--md-sys-color-outline);
        border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
        background: var(--md-sys-color-on-surface-variant);
    }
    
    /* States */
    .loading-state, .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 32px;
        color: var(--md-sys-color-on-surface-variant);
        text-align: center;
    }

    .error-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 64px 32px;
        color: var(--md-sys-color-on-surface-variant);
        text-align: center;
    }
    
    .error-state .material-symbols-outlined {
        font-size: 40px;
        margin-bottom: 16px;
        color: var(--md-sys-color-error);
    }
    
    .loading-state .material-symbols-outlined {
        font-size: 40px;
        margin-bottom: 16px;
        animation: spin 1.5s linear infinite;
        opacity: 0.5;
    }
    
    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    /* Модальное окно */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(3px);
    }
    
    .modal-content {
        position: relative;
        background: var(--md-sys-color-surface);
        border-radius: 24px;
        width: 100%;
        max-width: 460px;
        box-shadow: var(--md-elevation-3);
    }
    
    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px 12px;
    }
    
    .modal-header h3 {
        font-size: 1.2rem;
        font-weight: 600;
    }
    
    .modal-body {
        padding: 8px 24px 20px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--md-sys-color-on-surface-variant);
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        background: var(--md-sys-color-surface-variant);
        border: 1px solid transparent;
        border-radius: 16px;
        color: var(--md-sys-color-on-surface);
        font-size: 0.95rem;
        outline: none;
        transition: var(--transition-standard);
    }
    
    .form-group input:focus {
        border-color: var(--md-sys-color-primary);
        background: var(--md-sys-color-surface);
        box-shadow: var(--md-elevation-1);
    }
    
    .form-group input[type="color"] {
        padding: 4px;
        height: 48px;
        cursor: pointer;
    }
    
    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 16px 24px 20px;
        border-top: 1px solid var(--md-sys-color-outline);
    }
    
    /* Responsive */
    @media (max-width: 900px) {
        .sources-column { 
            width: 80px !important;
            min-width: 80px !important;
            max-width: 80px !important;
        }
        .source-info, .source-count { display: none; }
        .source-item { justify-content: center; padding: 12px; }
        .articles-column { 
            width: 300px !important;
            min-width: 300px !important;
        }
        .resize-handle { display: none; }
        .search-wrapper { min-width: 200px; }
    }
    </style>
</head>
<body>
    <!-- Top App Bar -->
    <!-- Top App Bar — Очищенная версия -->
    <div class="top-bar">
        <h1>Feedel</h1>
        
        <div class="search-wrapper">
            <span class="material-symbols-outlined">search</span>
            <input type="text" placeholder="Поиск по новостям..." id="searchInput">
        </div>
        
        <button class="icon-btn" id="refreshBtn" title="Обновить ленту">

    <!-- Main Layout -->
    <div class="app-container" id="appContainer">
        <!-- Left Column -->
        <div class="sources-column" id="leftColumn">
            <div class="column-header">

                <button class="icon-btn" id="addSourceBtn">

        <div class="content-column" id="rightColumn">
            <div class="content-header">

                    <div class="content-meta" id="detailMeta"></div>

    <!-- Модальное окно добавления источника -->
    <div class="modal" id="addSourceModal" style="display: none;">

                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">

                </div>

                <button class="md-button filled" id="saveSourceBtn">Добавить</button>

        </div>

    <script>
// ============================================
// Feedel — RSS-ридер с закладками
// ============================================

const API_URL = '/api';


let sources = [];
let allArticles = [];
let activeSource = 'all';
let activeArticleId = null;
let searchQuery = '';
let isLoading = false;

const elements = {
    sourcesList: document.getElementById('sourcesList'),
    articlesList: document.getElementById('articlesList'),
    articleCount: document.getElementById('articleCount'),
    detailSource: document.getElementById('detailSource'),
    detailTitle: document.getElementById('detailTitle'),
    detailMeta: document.getElementById('detailMeta'),
    detailBody: document.getElementById('detailBody'),
    searchInput: document.getElementById('searchInput'),
    refreshBtn: document.getElementById('refreshBtn'),
    clearCacheBtn: document.getElementById('clearCacheBtn'),
    addSourceBtn: document.getElementById('addSourceBtn'),
    readOriginalBtn: document.getElementById('readOriginalBtn'),
    bookmarkBtn: document.getElementById('bookmarkBtn')
};

// ============================================
// Работа с закладками
// ============================================

function getBookmarks() {
    return JSON.parse(localStorage.getItem('feedel_bookmarks') || '[]');
}

function saveBookmarks(bookmarks) {
    localStorage.setItem('feedel_bookmarks', JSON.stringify(bookmarks));
}

function isBookmarked(articleId) {
    return getBookmarks().some(b => b.id === articleId);
}

function toggleBookmark(article) {
    const bookmarks = getBookmarks();
    const index = bookmarks.findIndex(b => b.id === article.id);
    
    if (index === -1) {
        bookmarks.push(article);
        saveBookmarks(bookmarks);
        showToast('✅ Добавлено в закладки', 1500);
        return true;
    } else {
        bookmarks.splice(index, 1);
        saveBookmarks(bookmarks);
        showToast('🗑️ Убрано из закладок', 1500);
        return false;
    }
}

// ============================================
// API клиент
// ============================================

async function apiCall(endpoint, options = {}) {
    try {
        const response = await fetch(`${API_URL}${endpoint}`, {
            signal: AbortSignal.timeout(15000),
            ...options
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } catch (error) {
        console.error('API ошибка:', error);
        throw error;
    }
}

async function loadSources() {
    try {
        sources = await apiCall('/sources');
        console.log(`📋 Загружено ${sources.length} источников`);
    } catch (error) {
        console.error('Ошибка загрузки источников:', error);
        sources = [];
    }
}

async function loadAllFeeds(forceRefresh = false) {
    if (isLoading) return;
    
    isLoading = true;
    showLoadingState(true);
    
    try {
        const url = `/news${forceRefresh ? '?refresh=true' : ''}`;
        const data = await apiCall(url);
        
        allArticles = data.articles;
        console.log(`✅ Загружено ${allArticles.length} статей ${data.cached ? '(из кэша)' : '(свежие)'}`);
        
        applyFilters();
        
        if (allArticles.length > 0 && !activeArticleId) {
            selectArticle(allArticles[0].id);
        }
        
    } catch (error) {
        console.error('❌ Ошибка загрузки:', error);
        showError('Не удалось подключиться к серверу');
    } finally {
        isLoading = false;
        showLoadingState(false);
    }
}

async function clearCacheAndReload() {
    try {
        await fetch(`${API_URL}/clear-cache`, { method: 'POST' });
        showToast('🗑️ Кэш очищен', 1500);
        await loadAllFeeds(true);
    } catch (error) {
        console.error('Ошибка очистки кэша:', error);
    }
}

// ============================================
// UI Helpers
// ============================================

function showLoadingState(show) {
    if (show && allArticles.length === 0) {
        elements.articlesList.innerHTML = `
            <div class="loading-state">
                <span class="material-symbols-outlined">sync</span>
                <p>Загрузка новостей...</p>
                <small style="margin-top: 8px;">Первая загрузка может занять до 30 секунд</small>
            </div>
        `;
    }
}

function showError(message) {
    elements.articlesList.innerHTML = `
        <div class="error-state">
            <span class="material-symbols-outlined">error</span>
            <p>${message}</p>
            <button class="md-button outlined" style="margin-top: 24px;" onclick="location.reload()">
                <span class="material-symbols-outlined">refresh</span>
                Попробовать снова
            </button>
        </div>
    `;
}

function showToast(message, duration = 2000) {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #2D2F31;
        color: #E3E2E6;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 0.875rem;
        z-index: 1000;
        animation: fadeInOut ${duration}ms ease-in-out;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
    `;
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
    `;
    document.head.appendChild(style);
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.remove();
        style.remove();
    }, duration);
}

// ============================================
// Рендеринг источников (с закладками)
// ============================================

function renderSources() {
    const container = elements.sourcesList;
    container.innerHTML = '';
    
    // Все новости
    const allItem = document.createElement('div');
    allItem.className = `source-item ${activeSource === 'all' ? 'active' : ''}`;
    allItem.innerHTML = `
        <span class="material-symbols-outlined">inbox</span>
        <div class="source-info">
            <div class="source-name">Все новости</div>
            <div class="source-count">${allArticles.length} статей</div>
        </div>
    `;
    allItem.onclick = () => {
        activeSource = 'all';
        renderSources();
        renderArticles(allArticles);
        if (allArticles.length > 0) selectArticle(allArticles[0].id);
    };
    container.appendChild(allItem);
    
    // Закладки
    const bookmarks = getBookmarks();
    const bookmarksItem = document.createElement('div');
    bookmarksItem.className = `source-item ${activeSource === 'bookmarks' ? 'active' : ''}`;
    bookmarksItem.innerHTML = `
        <span class="material-symbols-outlined">bookmark</span>
        <div class="source-info">
            <div class="source-name">Закладки</div>
            <div class="source-count">${bookmarks.length} статей</div>
        </div>
    `;
    bookmarksItem.onclick = () => {
        activeSource = 'bookmarks';
        renderSources();
        renderArticles(bookmarks);
        if (bookmarks.length > 0) {
            selectArticle(bookmarks[0].id);
        } else {
            renderArticleDetail(null);
        }
    };
    container.appendChild(bookmarksItem);
    
    // Разделитель
    const separator = document.createElement('div');
    separator.style.cssText = 'height: 1px; background: var(--md-sys-color-outline); margin: 8px 16px; opacity: 0.5;';
    container.appendChild(separator);
    
    // Источники
    sources.forEach(source => {
        const articleCount = allArticles.filter(a => a.sourceId === source.id).length;
        const item = document.createElement('div');
        item.className = `source-item ${activeSource === source.id ? 'active' : ''}`;
        item.innerHTML = `
            <span class="material-symbols-outlined">feed</span>
            <div class="source-info">
                <div class="source-name" style="color: ${source.color}">${source.name}</div>
                <div class="source-count">${articleCount} статей</div>
            </div>
            <button class="icon-btn delete-source-btn" data-id="${source.id}" title="Удалить источник">
                <span class="material-symbols-outlined">delete</span>
            </button>
        `;
        
        item.querySelector('.source-info').onclick = () => {
            activeSource = source.id;
            renderSources();
            const filtered = allArticles.filter(a => a.sourceId === source.id);
            renderArticles(filtered);
            if (filtered.length > 0) selectArticle(filtered[0].id);
        };
        
        item.querySelector('.delete-source-btn').onclick = (e) => {
            e.stopPropagation();
            deleteSource(source.id);
        };
        
        container.appendChild(item);
    });
}

// ============================================
// Рендеринг статей (с кнопками удаления из закладок)
// ============================================

function renderArticles(articles) {
    if (articles.length === 0) {
        elements.articlesList.innerHTML = `
            <div class="empty-state">
                <span class="material-symbols-outlined">${activeSource === 'bookmarks' ? 'bookmark_off' : 'search_off'}</span>
                <p>${activeSource === 'bookmarks' ? 'Нет сохранённых закладок' : 'Новостей не найдено'}</p>
            </div>
        `;
        elements.articleCount.textContent = '0';
        return;
    }
    
    elements.articleCount.textContent = articles.length;
    
    const isBookmarksView = activeSource === 'bookmarks';
    
    elements.articlesList.innerHTML = articles.map(article => `
        <div class="article-item ${activeArticleId === article.id ? 'active' : ''}" 
             data-article-id="${article.id}">
            <div class="article-source" style="color: ${article.sourceColor || 'var(--md-sys-color-primary)'}">
                ${article.sourceName}
            </div>
            <div class="article-title">${escapeHtml(article.title)}</div>
            <div class="article-meta">
                <span class="article-time">
                    <span class="material-symbols-outlined">schedule</span>
                    ${article.time}
                </span>
                ${isBookmarksView ? `
                    <button class="icon-btn remove-bookmark-btn" data-id="${article.id}" 
                            style="margin-left: auto; width: 28px; height: 28px; opacity: 0.7;"
                            title="Убрать из закладок">
                        <span class="material-symbols-outlined" style="font-size: 18px;">bookmark_remove</span>
                    </button>
                ` : ''}
            </div>
        </div>
    `).join('');
    
    // Обработчики клика по статье
    document.querySelectorAll('.article-item').forEach(item => {
        item.addEventListener('click', (e) => {
            if (e.target.closest('.remove-bookmark-btn')) return;
            const articleId = item.dataset.articleId;
            selectArticle(articleId);
        });
    });
    
    // Обработчики удаления из закладок
    document.querySelectorAll('.remove-bookmark-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.id;
            const bookmarks = getBookmarks();
            const newBookmarks = bookmarks.filter(b => b.id !== id);
            saveBookmarks(newBookmarks);
            
            showToast('🗑️ Убрано из закладок', 1500);
            
            if (activeSource === 'bookmarks') {
                renderArticles(newBookmarks);
                renderSources();
                if (newBookmarks.length > 0) {
                    selectArticle(newBookmarks[0].id);
                } else {
                    renderArticleDetail(null);
                }
            }
            
            // Обновить кнопку в деталях, если открыта эта статья
            if (activeArticleId === id) {
                updateBookmarkButton();
            }
        });
    });
}

// ============================================
// Детали статьи
// ============================================

function selectArticle(articleId) {
    let article = allArticles.find(a => a.id === articleId);
    
    // Если не нашли в allArticles, ищем в закладках
    if (!article && activeSource === 'bookmarks') {
        article = getBookmarks().find(b => b.id === articleId);
    }
    
    if (!article) {
        console.warn('❌ Статья не найдена:', articleId);
        return;
    }
    
    activeArticleId = article.id;
    renderArticleDetail(article);
}

function updateBookmarkButton() {
    const article = allArticles.find(a => a.id === activeArticleId) || 
                   getBookmarks().find(b => b.id === activeArticleId);
    if (!article) return;
    
    const bookmarked = isBookmarked(article.id);
    elements.bookmarkBtn.innerHTML = bookmarked ? 
        '<span class="material-symbols-outlined">bookmark_remove</span> Убрать из закладок' :
        '<span class="material-symbols-outlined">bookmark</span> В закладки';
}

function renderArticleDetail(article) {
    if (!article) {
        elements.detailSource.textContent = 'Выберите статью';
        elements.detailSource.style.color = 'var(--md-sys-color-primary)';
        elements.detailTitle.textContent = 'Начните чтение';
        elements.detailMeta.innerHTML = '';
        elements.detailBody.innerHTML = `
            <div class="empty-state">
                <span class="material-symbols-outlined">newspaper</span>
                <p>Выберите новость из списка, чтобы прочитать её здесь</p>
            </div>
        `;
        activeArticleId = null;
        return;
    }
    
    activeArticleId = article.id;
    
    // Подсветка в списке
    document.querySelectorAll('.article-item').forEach(el => {
        el.classList.toggle('active', el.dataset.articleId === article.id);
    });
    
    elements.detailSource.textContent = article.sourceName;
    elements.detailSource.style.color = article.sourceColor || 'var(--md-sys-color-primary)';
    elements.detailTitle.textContent = article.title;
    elements.detailMeta.innerHTML = `
        <span class="article-time">
            <span class="material-symbols-outlined">schedule</span>
            ${article.time}
        </span>
    `;
    
    let content = article.content || article.summary || '';
    if (!content.includes('<p>') && !content.includes('<div>')) {
        content = `<p>${content}</p>`;
    }
    
    elements.detailBody.innerHTML = content;
    
    // Кнопка оригинала
    elements.readOriginalBtn.onclick = () => {
        window.open(article.url, '_blank');
    };
    
    // Кнопка закладок
    updateBookmarkButton();
    elements.bookmarkBtn.onclick = () => {
        const added = toggleBookmark(article);
        updateBookmarkButton();
        renderSources(); // Обновить счётчик закладок
        
        // Если мы в режиме закладок и удалили текущую статью
        if (activeSource === 'bookmarks' && !added) {
            const bookmarks = getBookmarks();
            renderArticles(bookmarks);
            if (bookmarks.length > 0) {
                selectArticle(bookmarks[0].id);
            } else {
                renderArticleDetail(null);
            }
        }
    };
}

// ============================================
// Фильтрация и поиск
// ============================================

function applyFilters() {
    let filtered = [];
    
    if (activeSource === 'bookmarks') {
        filtered = getBookmarks();
    } else if (activeSource === 'all') {
        filtered = [...allArticles];
    } else {
        filtered = allArticles.filter(a => a.sourceId === activeSource);
    }
    
    if (searchQuery) {
        const query = searchQuery.toLowerCase();
        filtered = filtered.filter(a => 
            a.title.toLowerCase().includes(query) || 
            a.sourceName.toLowerCase().includes(query)
        );
    }
    
    renderArticles(filtered);
    renderSources();
    
    const activeStillExists = activeArticleId && filtered.some(a => a.id === activeArticleId);
    
    if (!activeStillExists) {
        if (filtered.length > 0) {
            selectArticle(filtered[0].id);
        } else {
            renderArticleDetail(null);
        }
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================
// Управление источниками (модальное окно)
// ============================================

const modal = document.getElementById('addSourceModal');
const closeModalBtn = document.getElementById('closeModalBtn');
const cancelAddBtn = document.getElementById('cancelAddBtn');
const saveSourceBtn = document.getElementById('saveSourceBtn');
const sourceName = document.getElementById('sourceName');
const sourceUrl = document.getElementById('sourceUrl');
const sourceColor = document.getElementById('sourceColor');

function showModal() {
    modal.style.display = 'flex';
    sourceName.value = '';
    sourceUrl.value = '';
    sourceColor.value = '#D0BCFF';
    sourceName.focus();
}

function hideModal() {
    modal.style.display = 'none';
}

elements.addSourceBtn.addEventListener('click', showModal);
if (closeModalBtn) closeModalBtn.addEventListener('click', hideModal);
if (cancelAddBtn) cancelAddBtn.addEventListener('click', hideModal);
modal.querySelector('.modal-overlay')?.addEventListener('click', hideModal);

saveSourceBtn.addEventListener('click', async () => {
    const name = sourceName.value.trim();
    const url = sourceUrl.value.trim();
    const color = sourceColor.value;
    
    if (!name || !url) {
        showToast('⚠️ Заполните название и URL', 2000);
        return;
    }
    
    saveSourceBtn.disabled = true;
    saveSourceBtn.innerHTML = '<span class="material-symbols-outlined">sync</span> Добавление...';
    
    try {
        const response = await fetch(`${API_URL}/sources`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, url, color })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error);
        }
        
        const newSource = await response.json();
        sources.push(newSource);
        
        hideModal();
        showToast(`✅ Источник "${name}" добавлен`, 2000);
        await loadAllFeeds(true);
        
    } catch (error) {
        showToast(`❌ ${error.message}`, 3000);
    } finally {
        saveSourceBtn.disabled = false;
        saveSourceBtn.innerHTML = 'Добавить';
    }
});

async function deleteSource(sourceId) {
    if (!confirm('Удалить этот источник?')) return;
    
    try {
        const response = await fetch(`${API_URL}/sources/${sourceId}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Ошибка удаления');
        
        sources = sources.filter(s => s.id !== sourceId);
        showToast('🗑️ Источник удалён', 1500);
        await loadAllFeeds(true);
        
    } catch (error) {
        showToast('❌ Не удалось удалить источник', 2000);
    }
}

// ============================================
// Инициализация и обработчики
// ============================================

function initEvents() {
    elements.searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        applyFilters();
    });
    
    elements.refreshBtn.addEventListener('click', () => {
        loadAllFeeds(true);
    });
    
    elements.clearCacheBtn.addEventListener('click', clearCacheAndReload);
}

// ============================================
// Горячие клавиши
// ============================================

function initHotkeys() {
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        
        const articles = document.querySelectorAll('.article-item');
        const currentIndex = Array.from(articles).findIndex(el => 
            el.classList.contains('active')
        );
        
        // J / ↓ — следующая статья
        if (e.key === 'j' || e.key === 'ArrowDown') {
            e.preventDefault();
            const next = articles[currentIndex + 1];
            if (next) next.click();
        }
        
        // K / ↑ — предыдущая статья
        if (e.key === 'k' || e.key === 'ArrowUp') {
            e.preventDefault();
            const prev = articles[currentIndex - 1];
            if (prev) prev.click();
        }
        
        // R — обновить
        if (e.key === 'r') {
            e.preventDefault();
            loadAllFeeds(true);
        }
        
        // / — поиск
        if (e.key === '/') {
            e.preventDefault();
            elements.searchInput.focus();
        }
        
        // Escape — снять фокус
        if (e.key === 'Escape') {
            elements.searchInput.blur();
        }
    });
}

// ============================================
// Column Resizer (без изменений)
// ============================================

class ColumnResizer {
    constructor() {
        this.leftCol = document.getElementById('leftColumn');
        this.middleCol = document.getElementById('middleColumn');
        this.handle1 = document.getElementById('resizeHandle1');
        this.handle2 = document.getElementById('resizeHandle2');
        
        this.isResizing = false;
        this.currentHandle = null;
        this.startX = 0;
        this.startLeftWidth = 0;
        this.startMiddleWidth = 0;
        
        this.defaultLeftWidth = 260;
        this.defaultMiddleWidth = 340;
        
        this.init();
        this.loadSavedWidths();
    }
    
    init() {
        this.handle1.addEventListener('mousedown', (e) => this.startResize(e, 'left'));
        this.handle2.addEventListener('mousedown', (e) => this.startResize(e, 'middle'));
        document.addEventListener('mousemove', (e) => this.onResize(e));
        document.addEventListener('mouseup', () => this.stopResize());
    }
    
    startResize(e, handle) {
        e.preventDefault();
        this.isResizing = true;
        this.currentHandle = handle;
        this.startX = e.clientX;
        
        const leftStyles = window.getComputedStyle(this.leftCol);
        const middleStyles = window.getComputedStyle(this.middleCol);
        
        this.startLeftWidth = parseInt(leftStyles.width, 10);
        this.startMiddleWidth = parseInt(middleStyles.width, 10);
        
        document.body.classList.add('resizing');
    }
    
    onResize(e) {
        if (!this.isResizing) return;
        e.preventDefault();
        const deltaX = e.clientX - this.startX;
        
        if (this.currentHandle === 'left') {
            let newLeftWidth = this.startLeftWidth + deltaX;
            let newMiddleWidth = this.startMiddleWidth - deltaX;
            
            if (newLeftWidth >= 200 && newLeftWidth <= 400 &&
                newMiddleWidth >= 260 && newMiddleWidth <= 480) {
                document.documentElement.style.setProperty('--col-left-width', `${newLeftWidth}px`);
                document.documentElement.style.setProperty('--col-middle-width', `${newMiddleWidth}px`);
            }
        } else if (this.currentHandle === 'middle') {
            let newMiddleWidth = this.startMiddleWidth + deltaX;
            
            if (newMiddleWidth >= 260 && newMiddleWidth <= 480) {
                document.documentElement.style.setProperty('--col-middle-width', `${newMiddleWidth}px`);
            }
        }
    }
    
    stopResize() {
        if (this.isResizing) {
            this.isResizing = false;
            document.body.classList.remove('resizing');
            this.saveWidths();
        }
    }
    
    saveWidths() {
        const leftWidth = getComputedStyle(document.documentElement).getPropertyValue('--col-left-width').trim();
        const middleWidth = getComputedStyle(document.documentElement).getPropertyValue('--col-middle-width').trim();
        localStorage.setItem('feedel-left-width', leftWidth);
        localStorage.setItem('feedel-middle-width', middleWidth);
    }
    
    loadSavedWidths() {
        const savedLeft = localStorage.getItem('feedel-left-width');
        const savedMiddle = localStorage.getItem('feedel-middle-width');
        if (savedLeft) document.documentElement.style.setProperty('--col-left-width', savedLeft);
        if (savedMiddle) document.documentElement.style.setProperty('--col-middle-width', savedMiddle);
    }
}

// ============================================
// Запуск
// ============================================

async function init() {
    console.log('🚀 Feedel запущен');
    
    initEvents();
    initHotkeys();
    new ColumnResizer();
    
    try {
        await loadSources();
        await loadAllFeeds();
    } catch (error) {
        console.error('Ошибка инициализации:', error);
    }
    
    setInterval(() => {
        console.log('🔄 Автообновление...');
        loadAllFeeds(true);
    }, 15 * 60 * 1000);
}

init();
